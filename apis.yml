name: Norstel
description: 'Norstel AB was a Swedish semiconductor materials company that produced silicon carbide (SiC) wafers for power electronics, high-frequency and high-temperature electronics, and sensors, using its patented High Temperature Chemical Vapor Deposition (HTCVD) crystal-growth technology. Backed by Creandum among other investors, Norstel was acquired by STMicroelectronics in December 2019 and folded into ST''s silicon carbide operations; it no longer operates as an independent company. As a hardware and materials manufacturer, Norstel published no developer platform, API, or SDK, so this API Evangelist record is an identity-only profile with no API surface to enrich.'
